<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跃迹 · Leap Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F3B;
    --bg-soft:#262C52;
    --bg-soft2:#30366A;
    --panel:#F7F4EC;
    --panel-2:#FFFFFF;
    --ink:#1B1F3B;
    --ink-soft:#5B5F86;
    --line:#E4DFD0;
    --gold:#E8A33D;
    --mint:#4FBE9B;
    --coral:#E8615C;
    --sky:#5FA8E0;
    --brown:#B5804B;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% -10%, var(--bg-soft2), var(--bg) 60%);
    color:var(--panel);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- shell ---------- */
  #app{max-width:960px;margin:0 auto;padding:20px 20px 80px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px 22px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;
    background:linear-gradient(135deg,var(--gold),var(--coral));
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .brand-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:#B9BEE0;font-family:'JetBrains Mono',monospace;margin-top:-2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .pill{
    display:flex;align-items:center;gap:6px;
    background:var(--bg-soft2);border:1px solid #3E447C;
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--panel);
  }
  .pill.gem{color:var(--gold);}
  .icon-btn{
    background:var(--bg-soft2);border:1px solid #3E447C;color:var(--panel);
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;
  }
  .icon-btn:hover, .pill.clickable:hover{background:#3A4180;}
  .btn{
    border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;
  }
  .btn-primary{background:var(--gold);color:#2A1B04;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;border:1px solid #4A5090;color:var(--panel);}
  .btn-ghost:hover{background:var(--bg-soft2);}
  .btn-panel{background:var(--ink);color:var(--panel);}
  .btn-danger{background:transparent;border:1px solid rgba(232,97,92,.5);color:#FF8B85;}

  /* ---------- panel/card ---------- */
  .panel{
    background:var(--panel);color:var(--ink);
    border-radius:var(--radius);
    padding:26px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
  }
  .panel + .panel{margin-top:18px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;
  }

  /* ---------- home hero ---------- */
  .hero-title{font-size:30px;font-weight:800;margin:0 0 4px;line-height:1.2;}
  .hero-deadline{color:var(--ink-soft);font-size:14px;margin-bottom:18px;}
  .progress-track{background:var(--line);height:8px;border-radius:99px;overflow:hidden;margin:14px 0 4px;}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .5s ease;}
  .progress-label{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

  .stage{
    position:relative;background:#EAF3F8;
    border-radius:16px;overflow:hidden;margin-top:16px;
    border:3px solid var(--ink);
    box-shadow:inset 0 0 0 2px #fff, 4px 4px 0 rgba(27,31,59,.18);
  }
  .stage svg{display:block;width:100%;height:auto;}
  .marker-emoji{
    font-size:28px;filter:drop-shadow(0 4px 0 rgba(27,31,59,.25));
    animation:sprite-hop .6s steps(2) infinite;
    transform-origin:center bottom;
  }
  @keyframes sprite-hop{
    0%,100%{transform:translateY(0) scale(1,1);}
    50%{transform:translateY(-6px) scale(1.02,0.98);}
  }
  .stage.compact .marker-emoji{filter:drop-shadow(0 3px 0 rgba(27,31,59,.25));}

  /* ---------- mini "level map" route for daily/weekly subtasks ---------- */
  .mini-route{
    position:relative;flex:none;width:168px;margin-left:auto;align-self:center;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 18px -8px rgba(27,31,59,.35), 0 1px 0 rgba(255,255,255,.6) inset;
    padding:8px 8px 6px;cursor:pointer;text-align:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .mini-route:hover{transform:translateY(-2px);box-shadow:0 12px 22px -8px rgba(27,31,59,.4);}
  .mini-route svg{display:block;width:100%;height:auto;border-radius:10px;overflow:hidden;}
  .mini-route .cadence-tag{position:absolute;top:-8px;right:-6px;margin-top:0;}
  .node-map-big{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:0 14px 30px -14px rgba(27,31,59,.4);padding:10px;margin:12px 0 4px;
  }
  .node-map-big svg{display:block;width:100%;height:auto;border-radius:12px;overflow:hidden;}
  .modal.wide{max-width:460px;}

  /* ---------- pixel cadence tag label (used on mini/expanded route maps) ---------- */
  .cadence-tag{
    display:inline-block;margin-top:6px;font-family:'Press Start 2P',monospace;
    font-size:7px;letter-spacing:.02em;color:var(--ink);
    background:var(--gold);border-radius:5px;padding:3px 6px;
    border:2px solid var(--ink);
    box-shadow:2px 2px 0 rgba(27,31,59,.2);
  }
  .cadence-tag.weekly{background:var(--sky);}
  .cadence-tag.monthly{background:var(--mint);}

  /* ---------- setup form (always visible, above roadmap) ---------- */
  .setup-form{display:grid;gap:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .animal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .animal-opt{
    border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;
    background:#fff;font-size:22px;
  }
  .animal-opt.selected{border-color:var(--gold);background:#FFF3DF;}
  .animal-opt small{display:block;font-size:10px;color:var(--ink-soft);margin-top:4px;font-weight:700;}

  /* ---------- goal roadmap list ---------- */
  .section-label{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--panel);
    margin:26px 2px 12px;display:flex;align-items:center;gap:8px;
  }
  .goal-row{
    display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
    background:var(--panel-2);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;
    text-align:left;width:100%;
  }
  .goal-row:hover{border-color:var(--gold);}
  .goal-row .emoji{font-size:26px;width:40px;text-align:center;}
  .goal-row .info{flex:1;min-width:0;}
  .goal-row .info .name{font-weight:700;font-size:15px;}
  .goal-row .info .meta{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .ring{
    width:38px;height:38px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
    background:conic-gradient(var(--mint) calc(var(--p)*1%), var(--line) 0);
  }
  .ring span{background:#fff;border-radius:50%;width:29px;height:29px;display:flex;align-items:center;justify-content:center;}

  /* ---------- goal detail ---------- */
  .back{background:none;border:none;color:var(--panel);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 0;}
  .subtask{
    background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;
  }
  .subtask.done{background:#F2FBF7;border-color:#CDEFE0;}
  .subtask-top{display:flex;align-items:center;gap:12px;}
  .check{
    width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;background:#fff;font-size:14px;font-weight:900;color:#fff;
  }
  .check.on{background:var(--mint);border-color:var(--mint);}
  .subtask h4{margin:0 0 4px;font-size:16px;color:var(--ink);font-weight:800;}
  .subtask .detail{font-size:13.5px;color:#3A3E5C;line-height:1.55;font-weight:500;}
  .subtask .when{
    display:inline-block;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
    background:#FFF3DF;color:#8A5A11;padding:3px 8px;border-radius:7px;
  }
  .subtask-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .chip-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
    font-size:12.5px;font-weight:700;padding:7px 11px;display:flex;align-items:center;gap:5px;
  }
  .chip-btn.active{border-color:var(--gold);background:#FFF3DF;}
  .chip-btn.danger{color:#B23A34;border-color:#F3C9C6;}
  .inline-editor{
    margin-top:10px;background:#FBF9F2;border:1px dashed var(--line);border-radius:10px;padding:10px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  .inline-editor input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;flex:1;min-width:140px;}
  .gem-tag{font-size:12px;font-weight:800;color:var(--gold);background:#2A2410;background:#FFF3DF;color:#8A5A11;padding:3px 8px;border-radius:7px;}

  .add-subtask{
    width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);
    border-radius:12px;padding:12px;font-weight:700;font-size:13.5px;margin-top:6px;
  }
  .add-subtask:hover{border-color:var(--gold);color:var(--ink);}

  /* ---------- family / rewards ---------- */
  .member-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
  .toggle{
    width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;border:none;flex:none;
  }
  .toggle.on{background:var(--mint);}
  .toggle::after{
    content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;
  }
  .toggle.on::after{transform:translateX(16px);}
  .shared-goal-mini{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .rule-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;}
  .rule-row .g{font-weight:800;color:var(--gold);font-family:'JetBrains Mono',monospace;}

  /* ---------- family: likes / comments / gems ---------- */
  .member-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;}
  .member-card-head{display:flex;align-items:center;gap:12px;}
  .fgoal{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .fgoal-top{display:flex;align-items:center;gap:10px;}
  .fgoal-name{font-weight:700;font-size:14px;flex:1;}
  .fgoal-actions{display:flex;gap:8px;margin-top:8px;}
  .like-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink);}
  .like-btn.liked{background:#FDEBEA;border-color:#F3C9C6;color:#B23A34;}
  .comments{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .comment-item{font-size:12.5px;background:#FAF8F0;border-radius:8px;padding:7px 10px;}
  .comment-item b{font-size:12px;}
  .gem-send-btn{border:1px solid var(--line);background:#FFF3DF;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700;color:#8A5A11;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,30,.6);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--panel);color:var(--ink);border-radius:18px;padding:26px;width:100%;max-width:380px;}
  .tabs{display:flex;gap:6px;background:#EFEAD9;padding:4px;border-radius:10px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:700;font-size:13.5px;background:transparent;border:none;color:var(--ink-soft);}
  .tab.active{background:#fff;color:var(--ink);}
  .close-x{position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;color:var(--ink-soft);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;
  }
  .empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px 0;}
  .nav-tabs{display:flex;gap:8px;margin-bottom:6px;}
  .nav-tab{background:var(--bg-soft2);border:1px solid #3E447C;color:#B9BEE0;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;}
  .nav-tab.active{background:var(--gold);color:#2A1B04;border-color:var(--gold);}

  /* ---------- gem celebration: fireworks/confetti overlay ---------- */
  .gem-celebrate-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:90;
  }
  .gem-celebrate-badge{
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px;color:#fff;
    background:linear-gradient(135deg,var(--gold),#F4C36B);
    padding:16px 32px;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);
    border:3px solid #fff;animation:badge-pop .6s cubic-bezier(.34,1.6,.64,1);
  }
  @keyframes badge-pop{
    0%{transform:scale(.3);opacity:0;}
    55%{transform:scale(1.18);opacity:1;}
    75%{transform:scale(.96);}
    100%{transform:scale(1);}
  }
  .gem-celebrate-burst{position:absolute;width:0;height:0;}
  .confetti-piece{
    position:absolute;width:9px;height:9px;border-radius:2px;left:0;top:0;
    animation:confetti-burst 1.1s ease-out forwards;
  }
  @keyframes confetti-burst{
    0%{transform:translate(0,0) rotate(0deg);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0;}
  }

  /* ---------- treasure chest ---------- */
  .chest-emoji{font-size:56px;margin:6px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== 演示数据 / State ===================== */
const ANIMALS = {
  climb:{emoji:'🧗', label:'爬山小人', color:'#B5804B'},
  cheetah:{emoji:'🐆', label:'猎豹飞奔', color:'#E8A33D'},
  eagle:{emoji:'🦅', label:'老鹰飞翔', color:'#5FA8E0'},
  penguin:{emoji:'🐧', label:'企鹅走冰', color:'#4FBE9B'}
};

function uid(){ return Math.random().toString(36).slice(2,9); }

function demoGoal(){
  const deadline = '2027-07-01';
  const days = daysUntil(deadline);
  return {
    id: uid(),
    name: '明年夏天欧洲背包旅行',
    deadline,
    animal: 'eagle',
    shared:true,
    likes:2,
    comments:[{id:uid(), author:'妈妈', text:'这个计划超棒，期待你的欧洲之旅！'}],
    rewardRules:[
      {id:uid(), gems:20, reward:'出发前一起去挑一件旅行装备'},
      {id:uid(), gems:40, reward:'旅行路上加一次心愿餐厅'},
    ],
    subtasks: [
      mkTask('存旅行基金','每个月存一笔固定金额，坚持到出发前','每月 1 日',true,'每月1日提醒存钱','monthly',days),
      mkTask('购买机票','对比 2–3 家平台价格，锁定往返机票','出发前 2 个月内完成',true,'提前2个月提醒','once',days),
      mkTask('学习旅行常用语','每天学 1 句法语和西班牙语，整理成小卡片','每天进行',true,'每天 19:00','daily',days),
      mkTask('整理行李清单','列出并核对证件、转换插头、常备药品','出发前 2 周',true,'出发前14天提醒','once',days),
    ]
  };
}
/* 根据目标剩余天数 + 期望频率，自动决定实际打卡节奏：
   如果按期望频率算下来打卡次数太多（比如一年内每天打卡=365次），
   会自动降级为更省心的频率（每天→每周→每月），最多不超过 48 个打卡点。 */
function pickInterval(daysTotal, desired){
  if(desired==='once' || !daysTotal) return {interval:'once', count:0};
  const order = ['daily','weekly','monthly'];
  let idx = order.indexOf(desired); if(idx<0) idx = 0;
  const countFor = iv => iv==='daily' ? daysTotal : iv==='weekly' ? Math.ceil(daysTotal/7) : Math.ceil(daysTotal/30);
  let iv = order[idx];
  while(countFor(iv) > 48 && idx < order.length-1){ idx++; iv = order[idx]; }
  return {interval: iv, count: Math.max(1, countFor(iv))};
}
/* 按打卡频率 + 事项内容自动判断难度，决定每次打卡奖励几颗能量宝石 */
function difficultyGems(interval, title){
  let base = interval==='daily' ? 1 : interval==='weekly' ? 2 : interval==='monthly' ? 3 : 1;
  if(/训练|练习|背单词|冲刺|自测|体测|机票|基金/.test(title)) base += 1;
  return Math.min(base, 5);
}
function mkTask(title, detail, when, reminderOn, reminderText, cadence='once', daysTotal=null){
  const base = daysTotal || 60;
  const picked = pickInterval(base, cadence);
  const gems = difficultyGems(picked.interval, title);
  return {id:uid(), title, detail, when, done:false, reminderOn, reminderText, gems,
    cadence:picked.interval, streak:0, streakLen:picked.count, baseDays:base};
}

let state = {
  user: null, // {name, email, role}
  gems: 8,
  chestTarget: 50,
  showChest:false,
  goals: [ demoGoal() ],
  redemptionRules: [
    {id:uid(), gems:10, reward:'周末多看一集喜欢的剧'},
    {id:uid(), gems:25, reward:'和爸爸/妈妈约一次想去的餐厅'},
    {id:uid(), gems:50, reward:'一次心愿清单上的小礼物'},
  ],
  familyMembers: [
    {id:uid(), name:'妈妈', role:'家长', goals:[
      {id:uid(), name:'每天走 8000 步', progress:64, likes:2, likedByMe:false, comments:[{id:uid(),author:'弟弟 小宇',text:'妈妈加油，我们一起走！'}]}
    ]},
    {id:uid(), name:'弟弟 小宇', role:'青少年', goals:[
      {id:uid(), name:'每周读完《哈利波特》第一册', progress:35, likes:1, likedByMe:false, comments:[]}
    ]},
  ],
  view:'home',
  currentGoalId: null,
  parentMode:false,
  openEditor:{}, // taskId -> 'reminder'|'cadence'|null
  authTab:'signup',
  expandedTask:null, // "goalId:taskId"，控制打卡关卡地图放大弹层
  openFamilyComment:{}, // familyGoalId -> bool
  openGemSend:{}, // memberId -> bool
};
state.currentGoalId = state.goals[0].id;

/* ===================== 小事项智能生成 ===================== */
function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return Math.max(1, Math.ceil((d - new Date())/(1000*60*60*24)));
}
function smartSubtasks(name, deadline){
  const n = name;
  const days = deadline ? daysUntil(deadline) : 60;

  if(/旅行|旅游|欧洲|背包|环游/.test(n)){
    return [
      mkTask('存旅行基金','每个月存一笔固定金额，坚持到出发前','每月 1 日',true,'每月1日提醒存钱','monthly',days),
      mkTask('购买机票','对比几家平台价格，提前锁定往返机票','出发前 2 个月内完成',true,'提前2个月提醒','once',days),
      mkTask('学习当地常用语','每天学 1 句旅行常用语，路上更方便','每天进行',true,'每天 19:00','daily',days),
      mkTask('整理行李清单','列出证件、转换插头、常备药品','出发前 2 周',true,'出发前14天提醒','once',days),
    ];
  }
  // 读书类目标：只需要"每天/每周读几页"，不生成其他无关事项
  if(/读|书|哈利波特|小说/.test(n)){
    const totalPages = 300; // 按常见小说篇幅估算
    if(days <= 21){
      const perDay = Math.max(5, Math.round(totalPages/days));
      return [ mkTask('每天阅读', `每天读 ${perDay} 页，读完全书`, '每天进行', true, '每天 20:00', 'daily', days) ];
    }
    const weeks = Math.max(1, Math.round(days/7));
    const perWeek = Math.max(20, Math.round(totalPages/weeks));
    return [ mkTask('每周阅读', `每周读 ${perWeek} 页，保持稳定进度`, '每周日晚', true, '每周日 20:00', 'weekly', days) ];
  }
  if(/考试|学习|背单词|课程|升学/.test(n)){
    return [
      mkTask('每日练习','完成当日复习或练习题','每天进行',true,'每天 20:30','daily',days),
      mkTask('每周自测','用一次小测验检验掌握情况','每周六',true,'每周六上午','weekly',days),
      mkTask('考前冲刺','整理错题、复习薄弱点','截止日期前 2 周',true,'截止前14天提醒','once',days),
    ];
  }
  if(/运动|健身|马拉松|跑步|锻炼/.test(n)){
    return [
      mkTask('每周训练','按计划完成本周训练量','每周 3 次',true,'训练日 17:00','weekly',days),
      mkTask('每日拉伸恢复','关注饮水、拉伸与休息','每天进行',false,null,'daily',days),
      mkTask('阶段体测','检验体能提升情况','截止日期前',true,'截止前提醒','once',days),
    ];
  }
  // 通用兜底：只保留"持续推进"与"完成"两件事
  return [
    mkTask('保持进度','每周固定时间推进目标一点点','每周一次',true,'每周提醒一次','weekly',days),
    mkTask('完成目标','完成最后冲刺，回顾整个过程','截止日期前',false,null,'once',days),
  ];
}

/* ===================== 工具函数 ===================== */
function goalProgress(g){
  if(!g.subtasks.length) return 0;
  const done = g.subtasks.filter(t=>t.done).length;
  return Math.round(done/g.subtasks.length*100);
}
function findGoal(id){ return state.goals.find(g=>g.id===id); }
function daysLeft(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const diff = Math.ceil((d - new Date())/(1000*60*60*24));
  return diff;
}
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function celebrateGems(amount){
  const overlay = document.createElement('div');
  overlay.className = 'gem-celebrate-overlay';
  const colors = ['#E8A33D','#4FBE9B','#5FA8E0','#E8615C','#FFD75E'];
  let pieces = '';
  for(let i=0;i<22;i++){
    const angle = Math.random()*360;
    const dist = 70 + Math.random()*100;
    const dx = Math.cos(angle*Math.PI/180)*dist;
    const dy = Math.sin(angle*Math.PI/180)*dist;
    const color = colors[i%colors.length];
    const delay = (Math.random()*0.12).toFixed(2);
    pieces += `<span class="confetti-piece" style="--dx:${dx}px;--dy:${dy}px;background:${color};animation-delay:${delay}s;"></span>`;
  }
  overlay.innerHTML = `<div class="gem-celebrate-burst">${pieces}</div><div class="gem-celebrate-badge">💎 +${amount}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 1700);
}
function render(){ document.getElementById('app').innerHTML = renderView(); attachHandlers(); }
function go(view, goalId){ state.view=view; if(goalId) state.currentGoalId=goalId; render(); }

function stageSVG(animal, progress, opts){
  const a = ANIMALS[animal];
  // 简单的手绘感路径，四种动物各自的“地形”
  const paths = {
    climb:  'M20,150 C90,150 90,60 160,60 C220,60 220,110 280,110 C330,110 340,40 380,30',
    cheetah:'M15,110 C90,140 150,80 220,110 C280,135 330,90 385,100',
    eagle:  'M15,130 C80,40 150,150 220,60 C280,-5 330,110 385,50',
    penguin:'M15,120 C90,100 150,135 220,105 C280,80 330,115 385,95',
  };
  const compactPaths = {
    climb:  'M20,95 C90,95 90,45 160,45 C220,45 220,65 280,65 C330,65 335,20 380,15',
    cheetah:'M15,70 C90,85 150,50 220,68 C280,82 330,55 385,62',
    eagle:  'M15,80 C80,25 150,90 220,35 C280,-5 330,68 385,30',
    penguin:'M15,75 C90,62 150,85 220,65 C280,50 330,72 385,58',
  };
  const compact = !!opts;
  const d = compact ? compactPaths[animal] : paths[animal];
  const vbH = compact ? 110 : 170;
  const p = Math.max(2, Math.min(98, progress));
  return `
  <div class="stage${compact?' compact':''}">
    <svg viewBox="0 0 400 ${vbH}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${a.label}沿目标时间线前进的动画路径，当前完成 ${progress}%">
      ${terrainLayer(animal, 400, vbH, compact?'home-sm':'home-lg')}
      <path d="${d}" fill="none" stroke="${a.color}" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.55"/>
      ${[0.25,0.5,0.75].map(f=>{
        return `<circle class="coin-deco" data-coin-frac="${f}" r="${compact?4:5}" fill="#FFD75E" stroke="#8A5A11" stroke-width="1" opacity="${p/100 >= f ? 0.95 : 0.35}"/>`;
      }).join('')}
      <path id="trailPath" d="${d}" fill="none" stroke="none"/>
      <g id="marker"></g>
    </svg>
  </div>`;
}
function positionMarker(animal, progress){
  const svg = document.querySelector('.stage svg');
  const path = document.getElementById('trailPath');
  if(!svg || !path) return;
  const len = path.getTotalLength();
  const compact = document.querySelector('.stage.compact');
  const pt = path.getPointAtLength(len * (Math.max(2,Math.min(98,progress))/100));
  const g = document.getElementById('marker');
  const size = compact ? 26 : 40;
  g.innerHTML = `<foreignObject x="${pt.x-size/2}" y="${pt.y-size*0.85}" width="${size}" height="${size}" style="overflow:visible">
      <div class="marker-emoji" style="font-size:${size*0.7}px">${ANIMALS[animal].emoji}</div>
    </foreignObject>`;
  svg.querySelectorAll('.coin-deco').forEach(c=>{
    const f = parseFloat(c.dataset.coinFrac);
    const cpt = path.getPointAtLength(len*f);
    c.setAttribute('cx', cpt.x); c.setAttribute('cy', cpt.y - (compact?10:14));
  });
}

/* ===================== 打卡关卡地图（游戏化，用于每天/每周/每月的小事项） ===================== */
function nodeMapSVG(t, animal, big){
  const n = Math.max(t.streakLen,1);
  const W = big ? 520 : 176, H = big ? 150 : 64;
  const mX = big ? 44 : 16;
  const midY = H/2;
  const amp = big ? 32 : (n>10 ? 9 : 14);
  const pts = [];
  for(let i=0;i<n;i++){
    const x = n===1 ? W/2 : mX + i*(W-2*mX)/(n-1);
    const y = midY + Math.sin(i*1.7)*amp;
    pts.push({x,y,i});
  }
  const currentIdx = Math.min(t.streak, n-1);
  const cp = pts[currentIdx];
  const maxR = big ? 13 : 7.5, minR = big ? 6 : 3;
  const r = Math.max(minR, Math.min(maxR, (W-2*mX)/(n*2.4)));
  const gid = `nodefill-${t.id}-${big?'b':'m'}`;
  const smoothPath = pts.map((p,i)=> i===0 ? `M${p.x},${p.y}` : `Q${(pts[i-1].x+p.x)/2},${pts[i-1].y} ${p.x},${p.y}`).join(' ');
  const showCheck = r >= 5.5;
  const nodesSVG = pts.map(p=>{
    const filled = p.i < t.streak;
    const isLast = p.i === n-1;
    return `
      <circle cx="${p.x}" cy="${p.y+1.5}" r="${r}" fill="rgba(27,31,59,.18)"/>
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${filled?`url(#${gid})`:'#FFFFFF'}" stroke="#1B1F3B" stroke-width="${big?2.5:1.4}"/>
      ${filled && showCheck ? `<text x="${p.x}" y="${p.y+(big?5.5:3.2)}" font-size="${big?14:9}" text-anchor="middle" fill="#fff" font-weight="900">✓</text>` : ''}
      ${isLast ? `<text x="${p.x}" y="${p.y-r-(big?9:5)}" font-size="${big?22:12}" text-anchor="middle">🏁</text>` : ''}
    `;
  }).join('');
  const markerSize = big ? 48 : 25;
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="打卡关卡地图，已完成 ${t.streak}/${n}">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6BD9B4"/><stop offset="100%" stop-color="#42B392"/>
        </linearGradient>
      </defs>
      ${terrainLayer(animal, W, H, `node-${t.id}-${big?'b':'m'}`)}
      <path d="${smoothPath}" fill="none" stroke="#FFFFFF" stroke-width="${big?5:3.4}" opacity="0.7" stroke-linecap="round"/>
      <path d="${smoothPath}" fill="none" stroke="#1B1F3B" stroke-width="${big?2:1.2}" stroke-dasharray="${big?'1 8':'1 6'}" stroke-linecap="round" opacity="0.5"/>
      ${nodesSVG}
      <foreignObject x="${cp.x-markerSize/2}" y="${cp.y-markerSize*1.15}" width="${markerSize}" height="${markerSize}" style="overflow:visible">
        <div class="marker-emoji" style="font-size:${markerSize*0.72}px">${ANIMALS[animal].emoji}</div>
      </foreignObject>
    </svg>`;
}

          ${state.parentMode
            ? `<button class="chip-btn danger" data-remove-goal-rule="${g.id}:${r.id}">删除</button>`

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderView(){
  let body='';
  if(state.view==='home') body = viewHome();
  else if(state.view==='goal') body = viewGoalDetail();
  else if(state.view==='family') body = viewFamily();
  else if(state.view==='rewards') body = viewRewards();
  return body + authModal() + expandModal() + chestModal();
}

/* ===================== 事件绑定 ===================== */
function attachHandlers(){
  // 定位首页主目标动物 marker（下一帧，确保 SVG 已在 DOM 中）
  requestAnimationFrame(()=>{
    if(state.view==='home'){
      const g = findGoal(state.currentGoalId) || state.goals[0];
      if(g) positionMarker(g.animal, goalProgress(g));
    }
  });

  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>go(el.dataset.goto));
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>go('goal', el.dataset.open));
  document.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>go(el.dataset.back));

  // 动物选择
  document.querySelectorAll('.animal-opt').forEach(el=>{
    el.onclick=()=>{
      document.querySelectorAll('.animal-opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  // 新建目标
  const gf = document.getElementById('goalForm');
  if(gf) gf.onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById('goalName').value.trim();
    const date = document.getElementById('goalDate').value;
    const animalBtn = document.querySelector('.animal-opt.selected');
    const animal = animalBtn ? animalBtn.dataset.animal : 'climb';
    if(!name || !date){ toast('请填写目标名称和达成时间'); return; }
    const newGoal = { id:uid(), name, deadline:date, animal, subtasks: smartSubtasks(name, date), shared:false, likes:0, comments:[], rewardRules:[] };
    state.goals.unshift(newGoal);
    state.currentGoalId = newGoal.id;
    toast('目标已创建，已为你智能生成小事项 ✨');
    go('home');
  };

  // 打勾完成
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick=()=>{
      const [gid,tid] = el.dataset.toggle.split(':');
      const g = findGoal(gid); const t = g.subtasks.find(x=>x.id===tid);
      t.done = !t.done;
      if(t.done){
        state.gems += t.gems;
        toast(`完成！获得 ${t.gems} 颗能量宝石 💎`);
        celebrateGems(t.gems);
      } else {
        state.gems -= t.gems;
        toast('已取消完成状态');
      }
      render();
    };
  });

  // 每天/每周/每月打卡（在放大的关卡地图弹层内操作）
  document.querySelectorAll('[data-checkin]').forEach(el=>{
    el.onclick=()=>{
      const [gid,tid] = el.dataset.checkin.split(':');
      const g = findGoal(gid); const t = g.subtasks.find(x=>x.id===tid);
      if(t.streak >= t.streakLen){
        t.streak = 0; // 一轮打卡完成，开启下一轮
        const bonus = t.gems + 1;
        state.gems += bonus;
        toast(`一整轮打卡完成！额外获得 ${bonus} 颗能量宝石 🌟`);
        celebrateGems(bonus);
      } else {
        t.streak += 1;
        state.gems += t.gems;
        toast(`打卡成功，${ANIMALS[g.animal].label}又前进一步！+${t.gems} 💎`);
        celebrateGems(t.gems);
      }
      render();
    };
  });

  // 展开 / 关闭 打卡关卡地图（点击小事项右侧的小路线图）
  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.onclick=()=>{ state.expandedTask = el.dataset.expand; render(); };
  });
  document.querySelectorAll('[data-close-expand]').forEach(el=>{
    el.onclick=()=>{ state.expandedTask = null; render(); };
  });

  // 打开 提醒 / 打卡频率 编辑器
  document.querySelectorAll('[data-editor]').forEach(el=>{
    el.onclick=()=>{
      const [tid,kind] = el.dataset.editor.split(':');
      state.openEditor[tid] = state.openEditor[tid]===kind ? null : kind;
      render();
    };
  });
  document.querySelectorAll('[data-reminder-toggle]').forEach(el=>{
    el.onclick=()=>{
      const tid = el.dataset.reminderToggle;
      const g = findGoal(state.currentGoalId); const t = g.subtasks.find(x=>x.id===tid);
      t.reminderOn = !t.reminderOn;
      render();
    };
  });
  document.querySelectorAll('[data-save-editor]').forEach(el=>{
    el.onclick=()=>{
      const tid = el.dataset.saveEditor;
      const g = findGoal(state.currentGoalId); const t = g.subtasks.find(x=>x.id===tid);
      const rt = document.querySelector(`[data-reminder-text="${tid}"]`);
      if(rt) t.reminderText = rt.value.trim();
      state.openEditor[tid] = null;
      toast('已保存');
      render();
    };
  });
  document.querySelectorAll('[data-save-cadence]').forEach(el=>{
    el.onclick=()=>{
      const tid = el.dataset.saveCadence;
      const g = findGoal(state.currentGoalId); const t = g.subtasks.find(x=>x.id===tid);
      const sel = document.querySelector(`[data-cadence-select="${tid}"]`);
      const newCadence = sel ? sel.value : t.cadence;
      const picked = pickInterval(t.baseDays, newCadence);
      t.cadence = picked.interval;
      t.streakLen = picked.count;
      t.streak = 0;
      t.gems = difficultyGems(picked.interval, t.title);
      state.openEditor[tid] = null;
      toast(newCadence==='once' ? '已改为不打卡' : `已改为${CADENCE_ZH[picked.interval]}打卡`);
      render();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.onclick=()=>{
      const [gid,tid] = el.dataset.remove.split(':');
      const g = findGoal(gid);
      g.subtasks = g.subtasks.filter(x=>x.id!==tid);
      render();
    };
  });
  const addTaskBtn = document.querySelector('[data-add-task]');
  if(addTaskBtn) addTaskBtn.onclick = ()=>{
    const g = findGoal(addTaskBtn.dataset.addTask);
    g.subtasks.push(mkTask('新的小事项','点击标题可以描述具体要做什么','待设置',false,null,'once',daysUntil(g.deadline)));
    render();
  };

  // 目标专属奖励（只能在家长模式下增删，展示在目标下方而不是小事项下方）
  document.querySelectorAll('[data-add-goal-rule]').forEach(el=>{
    el.onclick=()=>{
      const gid = el.dataset.addGoalRule;
      const g = findGoal(gid);
      const gemsEl = document.getElementById(`newGoalRuleGems-${gid}`);
      const rewardEl = document.getElementById(`newGoalRuleReward-${gid}`);
      const gems = parseInt(gemsEl ? gemsEl.value : '');
      const reward = rewardEl ? rewardEl.value.trim() : '';
      if(!gems || !reward){ toast('请填写完整的奖励设置'); return; }
      g.rewardRules.push({id:uid(), gems, reward});
      render();
    };
  });
  document.querySelectorAll('[data-remove-goal-rule]').forEach(el=>{
    el.onclick=()=>{
      const [gid,rid] = el.dataset.removeGoalRule.split(':');
      const g = findGoal(gid);
      g.rewardRules = g.rewardRules.filter(r=>r.id!==rid);
      render();
    };
  });
  document.querySelectorAll('[data-redeem-goal]').forEach(el=>{
    el.onclick=()=>{
      const [gid,rid] = el.dataset.redeemGoal.split(':');
      const g = findGoal(gid);
      const r = g.rewardRules.find(x=>x.id===rid);
      if(state.gems >= r.gems){ state.gems -= r.gems; toast(`兑换成功：${r.reward} 🎉`); render(); }
      else toast(`宝石不够啦，还差 ${r.gems - state.gems} 颗`);
    };
  });

  // 家庭圈分享开关
  document.querySelectorAll('[data-share]').forEach(el=>{
    el.onclick=()=>{
      const g = findGoal(el.dataset.share);
      g.shared = !g.shared;
      render();
    };
  });

  // 家庭圈：点赞
  document.querySelectorAll('[data-like]').forEach(el=>{
    el.onclick=()=>{
      const mgId = el.dataset.like;
      for(const m of state.familyMembers){
        const mg = m.goals.find(x=>x.id===mgId);
        if(mg){
          mg.likedByMe = !mg.likedByMe;
          mg.likes += mg.likedByMe ? 1 : -1;
        }
      }
      render();
    };
  });

  // 家庭圈：留言
  document.querySelectorAll('[data-comment-toggle]').forEach(el=>{
    el.onclick=()=>{
      const mgId = el.dataset.commentToggle;
      state.openFamilyComment[mgId] = !state.openFamilyComment[mgId];
      render();
    };
  });
  document.querySelectorAll('[data-comment-submit]').forEach(el=>{
    el.onclick=()=>{
      const mgId = el.dataset.commentSubmit;
      const input = document.getElementById(`commentInput-${mgId}`);
      const text = input ? input.value.trim() : '';
      if(!text){ toast('写点什么再发送吧'); return; }
      for(const m of state.familyMembers){
        const mg = m.goals.find(x=>x.id===mgId);
        if(mg) mg.comments.push({id:uid(), author: state.user ? state.user.name : '我', text});
      }
      state.openFamilyComment[mgId] = false;
      toast('留言已发送');
      render();
    };
  });

  // 家长：送宝石
  document.querySelectorAll('[data-gem-send-toggle]').forEach(el=>{
    el.onclick=()=>{
      const mid = el.dataset.gemSendToggle;
      state.openGemSend[mid] = !state.openGemSend[mid];
      render();
    };
  });
  document.querySelectorAll('[data-gem-send-submit]').forEach(el=>{
    el.onclick=()=>{
      const mid = el.dataset.gemSendSubmit;
      const member = state.familyMembers.find(m=>m.id===mid);
      const amountEl = document.getElementById(`gemSendAmount-${mid}`);
      const noteEl = document.getElementById(`gemSendNote-${mid}`);
      const amount = parseInt(amountEl ? amountEl.value : '');
      if(!amount || amount<=0){ toast('请输入要送出的宝石数量'); return; }
      state.gems += amount;
      state.openGemSend[mid] = false;
      const note = noteEl ? noteEl.value.trim() : '';
      toast(`${member.name} 送给你 ${amount} 颗能量宝石 🎁${note ? '：'+note : ''}`);
      celebrateGems(amount);
      render();
    };
  });

  // 百宝箱
  document.querySelectorAll('[data-open-chest]').forEach(el=>{
    el.onclick=()=>{ state.showChest = true; render(); };
  });
  document.querySelectorAll('[data-close-chest]').forEach(el=>{
    el.onclick=()=>{ state.showChest = false; render(); };
  });
  const saveChestBtn = document.querySelector('[data-save-chest-target]');
  if(saveChestBtn) saveChestBtn.onclick = ()=>{
    const input = document.getElementById('chestTargetInput');
    const val = parseInt(input ? input.value : '');
    if(!val || val<=0){ toast('请输入一个大于 0 的集满数量'); return; }
    state.chestTarget = val;
    toast('百宝箱集满数量已更新');
    render();
  };

  // 奖励与宝石
  const parentToggle = document.querySelector('[data-parent-toggle]');
  if(parentToggle) parentToggle.onclick = ()=>{ state.parentMode=!state.parentMode; render(); };
  document.querySelectorAll('[data-redeem]').forEach(el=>{
    el.onclick=()=>{
      const r = state.redemptionRules.find(x=>x.id===el.dataset.redeem);
      if(state.gems >= r.gems){ state.gems -= r.gems; toast(`兑换成功：${r.reward} 🎉`); render(); }
      else toast(`宝石不够啦，还差 ${r.gems - state.gems} 颗`);
    };
  });
  document.querySelectorAll('[data-remove-rule]').forEach(el=>{
    el.onclick=()=>{ state.redemptionRules = state.redemptionRules.filter(r=>r.id!==el.dataset.removeRule); render(); };
  });
  const addRuleBtn = document.querySelector('[data-add-rule]');
  if(addRuleBtn) addRuleBtn.onclick = ()=>{
    const gems = parseInt(document.getElementById('newRuleGems').value);
    const reward = document.getElementById('newRuleReward').value.trim();
    if(!gems || !reward){ toast('请填写完整的兑换规则'); return; }
    state.redemptionRules.push({id:uid(), gems, reward});
    render();
  };

  // 注册 / 登录
  document.querySelectorAll('[data-open-auth]').forEach(el=>el.onclick=()=>{ state.showAuth=true; render(); });
  document.querySelectorAll('[data-close-auth]').forEach(el=>el.onclick=()=>{ state.showAuth=false; render(); });
  document.querySelectorAll('[data-authtab]').forEach(el=>el.onclick=()=>{ state.authTab=el.dataset.authtab; render(); });
  const authForm = document.getElementById('authForm');
  if(authForm) authForm.onsubmit=(e)=>{
    e.preventDefault();
    const emailEl = document.getElementById('authEmail');
    const email = emailEl ? emailEl.value.trim() : '';
    if(!email){ toast('请输入邮箱'); return; }
    const nameEl = document.getElementById('authName');
    const roleSel = document.getElementById('authRole');
    const name = nameEl ? nameEl.value.trim() : email.split('@')[0];
    const role = roleSel ? roleSel.value : 'teen';
    if(state.authTab==='signup' && !name){ toast('请输入昵称'); return; }
    state.user = {name, email, role};
    state.showAuth = false;
    toast(`欢迎，${name}！已用 ${email} ${state.authTab==='signup'?'注册':'登录'}`);
    render();
  };
}

render();
</script>
</body>
</html>
